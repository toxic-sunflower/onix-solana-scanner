server {
    server_name onix-scanner.it;

    location /admin/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Blazor Server keeps one long-lived WebSocket open per browser tab
        # (the SignalR "circuit"). Without this, nginx's default 60s idle
        # timeout kills it periodically, and the UI flickers through a
        # reconnect every time - this is what fixes that.
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass http://onix_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/onix-scanner.it/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/onix-scanner.it/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = onix-scanner.it) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name onix-scanner.it;
    return 404; # managed by Certbot
}
