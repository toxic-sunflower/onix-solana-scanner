services:
  app_blue:
    build:
      context: .
      dockerfile: src/Onix.Scanner.Api/Dockerfile
    container_name: onix_app_blue
    network_mode: host
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
      - Telegram__BotUsername=${TELEGRAM_BOT_USERNAME}
      - Telegram__OpenId__ClientId=${TELEGRAM_OAUTH_CLIENT_ID}
      - Telegram__OpenId__ClientSecret=${TELEGRAM_OAUTH_CLIENT_SECRET}
      - Telegram__OpenId__RedirectUri=${TELEGRAM_OAUTH_REDIRECT_URI}
      - Telegram__WebhookSecret=${TELEGRAM_WEBHOOK_SECRET}
      - Encryption__Key=${ENCRYPTION_KEY}
      - ConnectionStrings__Default=Host=localhost;Database=onix_scanner;Username=onix;Password=${DB_PASSWORD}
      - App__Url=${APP_URL}
    healthcheck:
      test: curl -f http://localhost:5000/api/v1/health || exit 1
      interval: 15s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  app_green:
    build:
      context: .
      dockerfile: src/Onix.Scanner.Api/Dockerfile
    container_name: onix_app_green
    network_mode: host
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5001
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
      - Telegram__BotUsername=${TELEGRAM_BOT_USERNAME}
      - Telegram__OpenId__ClientId=${TELEGRAM_OAUTH_CLIENT_ID}
      - Telegram__OpenId__ClientSecret=${TELEGRAM_OAUTH_CLIENT_SECRET}
      - Telegram__OpenId__RedirectUri=${TELEGRAM_OAUTH_REDIRECT_URI}
      - Telegram__WebhookSecret=${TELEGRAM_WEBHOOK_SECRET}
      - Encryption__Key=${ENCRYPTION_KEY}
      - ConnectionStrings__Default=Host=localhost;Database=onix_scanner;Username=onix;Password=${DB_PASSWORD}
      - App__Url=${APP_URL}
    healthcheck:
      test: curl -f http://localhost:5001/api/v1/health || exit 1
      interval: 15s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Internal Blazor Server admin panel — single instance (no blue/green, brief
  # restart on deploy is fine for an internal tool). Login has no 2FA, only a
  # rate limit — so unlike app_blue/app_green (which rely on the server
  # firewall blocking 5000/5001 externally, with nginx as the only public
  # door), this one binds to 127.0.0.1 only, not 0.0.0.0. With
  # network_mode: host that means the port never appears on the server's
  # public interface at all — no firewall rule required, reachable only via
  # SSH tunnel (`ssh -L 5050:127.0.0.1:5050 app@server`) or from the box itself.
  admin:
    build:
      context: .
      dockerfile: src/Onix.Scanner.Admin/Dockerfile
    container_name: onix_admin
    network_mode: host
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://127.0.0.1:5050
      - Admin__Username=${ADMIN_USERNAME}
      - Admin__Password=${ADMIN_PASSWORD}
      - Encryption__Key=${ENCRYPTION_KEY}
      - ConnectionStrings__Default=Host=localhost;Database=onix_scanner;Username=onix;Password=${DB_PASSWORD}
    healthcheck:
      test: curl -f http://127.0.0.1:5050/login || exit 1
      interval: 15s
      retries: 5
      start_period: 30s
    restart: unless-stopped
